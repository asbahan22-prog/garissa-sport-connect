services:
  - type: web
    name: garissa-sport-connect
    runtime: node
    buildCommand: npm install && npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        value: https://garissa-sport-connect.onrender.com
      - key: SERVER_URL
        value: https://garissa-sport-connect.onrender.com
      - key: AUTO_SEED
        value: "false"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
